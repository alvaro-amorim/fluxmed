name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    name: PostgreSQL + PostGIS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database
        run: docker compose up -d db
      - name: Wait for database readiness
        run: |
          for attempt in {1..20}; do
            if docker compose exec -T db pg_isready -U fluxmed -d fluxmed; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Stop database
        if: always()
        run: docker compose down -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
