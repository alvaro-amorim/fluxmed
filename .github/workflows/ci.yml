name: Full CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fluxmed
          POSTGRES_USER: fluxmed
          POSTGRES_PASSWORD: fluxmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxmed -d fluxmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fluxmed:fluxmed@localhost:5432/fluxmed
      TEST_DATABASE_URL: postgresql+psycopg://fluxmed:fluxmed@localhost:5432/fluxmed
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src
      - name: Migrations
        run: alembic upgrade head
      - name: Tests
        run: python -X faulthandler -m pytest -q -o faulthandler_timeout=180

  frontend:
    name: Frontend
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Demo login E2E
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fluxmed
          POSTGRES_USER: fluxmed
          POSTGRES_PASSWORD: fluxmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxmed -d fluxmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fluxmed:fluxmed@localhost:5432/fluxmed
      TEST_DATABASE_URL: postgresql+psycopg://fluxmed:fluxmed@localhost:5432/fluxmed
      SESSION_COOKIE_SECURE: 'false'
      DEMO_PLANNER_EMAIL: planner@fluxmed.demo
      DEMO_PLANNER_PASSWORD: FluxMedDemo2026!
      VITE_DEMO_EMAIL: planner@fluxmed.demo
      VITE_DEMO_PASSWORD: FluxMedDemo2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install backend
        run: python -m pip install -e 'apps/api[dev]'
      - name: Prepare database and demo user
        working-directory: apps/api
        run: alembic upgrade head && python -m fluxmed.scripts.seed_demo
      - name: Install frontend
        working-directory: apps/web
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run demo login journey
        working-directory: apps/web
        run: npm run test:e2e
