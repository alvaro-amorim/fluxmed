name: PR Backend Fast

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/**'
      - '.github/workflows/pr-backend.yml'

permissions:
  contents: read

concurrency:
  group: pr-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-fast:
    name: Backend fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
