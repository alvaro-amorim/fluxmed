# Local academic/demo stack. Run from the repository root after copying .env.example to .env.
x-api-common: &api-common
  image: fluxmed-api:local
  env_file:
    - .env
  environment:
    DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-fluxmed}:${POSTGRES_PASSWORD:-fluxmed}@db:5432/${POSTGRES_DB:-fluxmed}"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxmed}
      POSTGRES_USER: ${POSTGRES_USER:-fluxmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxmed}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxmed} -d ${POSTGRES_DB:-fluxmed}"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - fluxmed_postgres_data:/var/lib/postgresql/data

  init:
    <<: *api-common
    # Build the shared API image exactly once (Docker Desktop BuildKit can race
    # when two Compose services export the same image tag concurrently).
    build:
      context: ./apps/api
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m fluxmed.scripts.seed_demo"]

  api:
    <<: *api-common
    # The init service builds this image before containers start; never pull it.
    pull_policy: never
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - uvicorn
      - fluxmed.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      FLUXMED_API_PROXY_TARGET: "http://api:8000"
      VITE_API_BASE_URL: ""
      VITE_DEMO_EMAIL: "${VITE_DEMO_EMAIL:-planner@fluxmed.demo}"
      VITE_DEMO_PASSWORD: "${VITE_DEMO_PASSWORD:-FluxMedDemo2026!}"

volumes:
  fluxmed_postgres_data:
